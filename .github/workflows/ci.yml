name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  checks:
    name: Types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Type check
        run: mypy --strict
      - name: Lint
        run: ruff check .

  example:
    name: The worked example reproduces its published figures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Basel calibration
        # Exits non-zero if either published figure fails to reproduce, so a
        # change to the numerics cannot quietly move a number that has been in
        # print since 2016.
        run: python examples/basel_equivalence.py
      - name: The command line runs over the bundled data
        run: |
          shortfall risk examples/returns.csv --weights 0.4,0.25,0.15,0.2 --shrink
          shortfall contributions examples/returns.csv --weights 0.4,0.25,0.15,0.2
          shortfall parity examples/returns.csv --shrink
          shortfall drawdown examples/returns.csv --periods 252
          shortfall factors examples/returns.csv --factors examples/factors.csv
          shortfall volatility examples/returns.csv --weights 0.4,0.25,0.15,0.2
          shortfall volatility examples/returns.csv --paths 5000 --horizon 10
          shortfall --json risk examples/returns.csv > /dev/null

  package:
    name: Wheel installs and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      # The same reading of the metadata the index performs on upload. Failing it
      # here is failing it in the only place a failure is still cheap: an index
      # will not accept a replacement for a version already taken.
      - name: Check the metadata the index will read
        run: python -m twine check --strict dist/*
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
      - name: The installed package estimates something
        # A wheel that imports but cannot produce a number is not a working
        # library, so the check runs an estimate end to end and asserts an
        # identity that has to hold: shrinkage preserves the variances.
        run: |
          /tmp/check/bin/python - <<'PY'
          import random
          from shortfall import Panel, ledoit_wolf, sample_covariance

          rng = random.Random(0)
          factor = [rng.gauss(0.0, 0.01) for _ in range(40)]
          panel = Panel.from_columns(
              {f"a{i}": [factor[t] + rng.gauss(0.0, 0.008) for t in range(40)] for i in range(6)}
          )
          result = ledoit_wolf(panel)
          unbiased = sample_covariance(panel)
          assert 0.0 <= result.intensity <= 1.0, result.intensity
          for i in range(6):
              assert abs(result.matrix[i][i] - unbiased[i][i]) < 1e-20
          assert result.diagnostics.positive_semidefinite
          print(f"shrinkage intensity {result.intensity:.4f}, variances preserved")
          PY
      # These assertions read License-Expression, License-File and the classifiers
      # out of dist-info. In the test job that dist-info belongs to an editable
      # install, written once and able to agree with a pyproject.toml that has
      # since changed. Here it is the artefact that would actually be published.
      - name: The metadata tests run against the installed wheel
        run: |
          /tmp/check/bin/pip install pytest
          /tmp/check/bin/python -m pytest tests/test_metadata.py -q
      # The sdist is built by a different code path from the wheel, and a file
      # left out of one can be present in the other: py.typed and LICENSE both
      # arrive by mechanisms that apply to only one of the two. The sdist is also
      # what an index serves to anyone whose platform has no matching wheel.
      - name: Install the sdist into a clean environment and run it
        run: |
          python -m venv /tmp/from-sdist
          /tmp/from-sdist/bin/pip install dist/*.tar.gz
          /tmp/from-sdist/bin/shortfall --version
          /tmp/from-sdist/bin/shortfall --json risk examples/returns.csv > /dev/null
          /tmp/from-sdist/bin/python -c "
          import shortfall, pathlib
          assert (pathlib.Path(shortfall.__file__).parent / 'py.typed').is_file()
          print('py.typed present in the sdist install')
          "
