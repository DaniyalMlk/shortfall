name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  checks:
    name: Types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Type check
        run: mypy --strict
      - name: Lint
        run: ruff check .
      - name: Every subcommand's --help renders
        run: python scripts/check_help.py

  example:
    name: The worked example reproduces its published figures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Basel calibration
        # Exits non-zero if either published figure fails to reproduce, so a
        # change to the numerics cannot quietly move a number that has been in
        # print since 2016.
        run: python examples/basel_equivalence.py
      - name: The fitted tail reproduces its published comparison
        # Exits non-zero if the measured advantage over historical simulation and
        # a fitted normal moves, so a change to the optimiser or the threshold
        # rule cannot quietly rewrite a figure the README quotes.
        run: python examples/tail_comparison.py
      - name: The worst case reproduces its published comparison
        # Exits non-zero if the measured gap between a joint search and a
        # one-factor-at-a-time stress test moves, so a change to the
        # trust-region solver cannot quietly rewrite a figure the README
        # quotes.
        run: python examples/worst_case_scenario.py
      - name: The command line runs over the bundled data
        run: |
          shortfall risk examples/returns.csv --weights 0.4,0.25,0.15,0.2 --shrink
          shortfall contributions examples/returns.csv --weights 0.4,0.25,0.15,0.2
          shortfall parity examples/returns.csv --shrink
          shortfall drawdown examples/returns.csv --periods 252
          shortfall curvature examples/returns.csv --delta 0.5,-0.2,0.1,0.0 \
            --gamma-diagonal 40,30,25,0 --theta-funded
          shortfall curvature examples/returns.csv --delta 0.5,-0.2,0.1,0.0 \
            --gamma-diagonal=-40,-30,-25,0 --theta-funded --confidence 0.95
          shortfall worst-case examples/returns.csv --delta 0.5,-0.2,0.1,0.0 \
            --gamma-diagonal=-40,-30,-25,0
          shortfall worst-case examples/returns.csv --delta 0.5,-0.2,0.1,0.0 \
            --radius 3.0
          shortfall factors examples/returns.csv --factors examples/factors.csv
          shortfall volatility examples/returns.csv --weights 0.4,0.25,0.15,0.2
          shortfall volatility examples/returns.csv --paths 5000 --horizon 10
          shortfall tail examples/returns.csv --weights 0.4,0.25,0.15,0.2 --curve 6
          shortfall tail examples/returns.csv --confidence 0.9999 --column equity
          shortfall copula examples/returns.csv --weights 0.4,0.25,0.15,0.2 \
            --paths 4000 --seed 1
          shortfall copula examples/returns.csv --family gaussian \
            --marginal extreme_value --paths 4000 --seed 2
          shortfall --json risk examples/returns.csv > /dev/null
          shortfall --json tail examples/returns.csv > /dev/null
          shortfall --json copula examples/returns.csv --paths 4000 > /dev/null
          shortfall --json worst-case examples/returns.csv --delta 0.5,-0.2,0.1,0.0 \
            --gamma-diagonal=-40,-30,-25,0 > /dev/null

  package:
    name: Wheel installs and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      # The same reading of the metadata the index performs on upload. Failing it
      # here is failing it in the only place a failure is still cheap: an index
      # will not accept a replacement for a version already taken.
      - name: Check the metadata the index will read
        run: python -m twine check --strict dist/*
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
      # Every subcommand's --help, against the artefact that would be published.
      # argparse expands help strings through %-formatting, so a literal per
      # cent sign raises TypeError at display time and nowhere else: the suite
      # exercises the commands and the commands work. Only --help is broken,
      # and it is the first thing anybody types. Eight of twenty subcommands
      # shipped that way.
      - name: Every subcommand prints help
        run: |
          /tmp/check/bin/shortfall --help > /dev/null
          for sub in $(/tmp/check/bin/python - <<'PY'
          import argparse
          from shortfall.cli import build_parser
          for action in build_parser()._actions:
              if isinstance(action, argparse._SubParsersAction):
                  print(" ".join(sorted(action.choices)))
                  break
          PY
          ); do
            /tmp/check/bin/shortfall "$sub" --help > /dev/null || {
              echo "shortfall $sub --help failed"; exit 1; }
          done
          echo "every subcommand printed help"
      - name: The installed package estimates something
        # A wheel that imports but cannot produce a number is not a working
        # library, so the check runs an estimate end to end and asserts an
        # identity that has to hold: shrinkage preserves the variances.
        run: |
          /tmp/check/bin/python - <<'PY'
          import random
          from shortfall import Panel, ledoit_wolf, sample_covariance

          rng = random.Random(0)
          factor = [rng.gauss(0.0, 0.01) for _ in range(40)]
          panel = Panel.from_columns(
              {f"a{i}": [factor[t] + rng.gauss(0.0, 0.008) for t in range(40)] for i in range(6)}
          )
          result = ledoit_wolf(panel)
          unbiased = sample_covariance(panel)
          assert 0.0 <= result.intensity <= 1.0, result.intensity
          for i in range(6):
              assert abs(result.matrix[i][i] - unbiased[i][i]) < 1e-20
          assert result.diagnostics.positive_semidefinite

          # And the other estimator, whose identities are the trace and the
          # diagonal. Six assets over forty observations puts q at 0.15, so
          # the common factor is comfortably outside the band.
          from shortfall import clip_spectrum, detection_threshold

          cleaned = clip_spectrum(panel)
          assert cleaned.kept >= 1, cleaned.observed
          assert abs(sum(cleaned.cleaned) - 6.0) < 1e-9, sum(cleaned.cleaned)
          # Relative, unlike the shrinkage check above: cleaning restores the
          # diagonal by rescaling a rebuilt matrix rather than by never touching
          # it, so the agreement is to rounding and not to the bit.
          for i in range(6):
              assert abs(cleaned.covariance[i][i] / unbiased[i][i] - 1.0) < 1e-12
          print(
              f"shrinkage intensity {result.intensity:.4f}, variances preserved; "
              f"{cleaned.kept} of 6 directions above the band, smallest detectable "
              f"factor {detection_threshold(6, 40):.3f}"
          )
          PY
      # These assertions read License-Expression, License-File and the classifiers
      # out of dist-info. In the test job that dist-info belongs to an editable
      # install, written once and able to agree with a pyproject.toml that has
      # since changed. Here it is the artefact that would actually be published.
      - name: The metadata tests run against the installed wheel
        run: |
          /tmp/check/bin/pip install pytest
          /tmp/check/bin/python -m pytest tests/test_metadata.py -q
      # The sdist is built by a different code path from the wheel, and a file
      # left out of one can be present in the other: py.typed and LICENSE both
      # arrive by mechanisms that apply to only one of the two. The sdist is also
      # what an index serves to anyone whose platform has no matching wheel.
      - name: Install the sdist into a clean environment and run it
        run: |
          python -m venv /tmp/from-sdist
          /tmp/from-sdist/bin/pip install dist/*.tar.gz
          /tmp/from-sdist/bin/shortfall --version
          /tmp/from-sdist/bin/shortfall --json risk examples/returns.csv > /dev/null
          /tmp/from-sdist/bin/python -c "
          import shortfall, pathlib
          assert (pathlib.Path(shortfall.__file__).parent / 'py.typed').is_file()
          print('py.typed present in the sdist install')
          "
